<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Library</title>
<meta name="description" content="Emin's personal library: books read, want to read and reading stats.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17140F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Library">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div>
      <h1 id="view-title">My Shelves</h1>
      <p id="view-sub" class="sub"></p>
    </div>
    <button type="button" id="lang-toggle" class="lang-toggle" aria-label="Türkçe" title="Türkçe">TR</button>
  </div>
</header>

<main>
  <!-- Raflar -->
  <section id="view-shelves" class="view" data-view="shelves">
    <div id="reading-now"></div>
    <nav class="chips" id="shelf-chips" aria-label="Raflar"></nav>
    <div class="toolbar">
      <div class="toolbar-l">
      <label class="select">
        <span class="sr-only">Sort</span>
        <select id="shelf-sort">
          <option value="dateRead">Date read</option>
          <option value="added">Date added</option>
          <option value="title">Title</option>
          <option value="author">Author</option>
          <option value="rating">My rating</option>
          <option value="year">Publication year</option>
          <option value="topic">Topic</option>
        </select>
      </label>
      <label class="select" id="shelf-format-wrap" hidden>
        <span class="sr-only">Format</span>
        <select id="shelf-format"></select>
      </label>
      </div>
      <div class="seg" role="group" aria-label="Görünüm">
        <button type="button" data-layout="grid" aria-label="Kapaklar"><svg viewBox="0 0 24 24"><path d="M4 4h6v7H4zM14 4h6v7h-6zM4 13h6v7H4zM14 13h6v7h-6z"/></svg></button>
        <button type="button" data-layout="list" aria-label="Liste"><svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zM4 11h16v2H4zM4 17h16v2H4z"/></svg></button>
      </div>
    </div>
    <div id="shelf-body"></div>
  </section>

  <!-- Ara -->
  <section id="view-search" class="view" data-view="search" hidden>
    <div class="searchbox">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 1 0 4.2 12.6l5.1 5.1 1.4-1.4-5.1-5.1A7 7 0 0 0 10 3zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></svg>
      <input id="q" type="search" placeholder="Search title or author" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="filters">
      <label class="select"><span class="sr-only">Shelf</span><select id="f-status"></select></label>
      <label class="select"><span class="sr-only">Topic</span><select id="f-topic"></select></label>
      <label class="select"><span class="sr-only">Format</span><select id="f-format"></select></label>
      <label class="select"><span class="sr-only">Language</span><select id="f-lang"></select></label>
    </div>
    <p id="search-count" class="count"></p>
    <div id="search-body"></div>
  </section>

  <!-- İstatistik -->
  <section id="view-stats" class="view" data-view="stats" hidden>
    <div id="stats-body"></div>
  </section>
</main>

<nav class="tabbar" aria-label="Bölümler">
  <button type="button" data-tab="shelves" class="active">
    <svg viewBox="0 0 24 24"><path d="M4 3h3v18H4zM8.5 3h3v18h-3zM13 4.2l2.9-.8 4.7 17.4-2.9.8z"/></svg>
    <span data-i18n-tab="shelves">Shelves</span>
  </button>
  <button type="button" data-tab="search">
    <svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 1 0 4.2 12.6l5.1 5.1 1.4-1.4-5.1-5.1A7 7 0 0 0 10 3zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></svg>
    <span data-i18n-tab="search">Search</span>
  </button>
  <button type="button" data-tab="stats">
    <svg viewBox="0 0 24 24"><path d="M4 20V10h3v10zm6.5 0V4h3v16zM17 20v-7h3v7z"/></svg>
    <span data-i18n-tab="stats">Stats</span>
  </button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <article class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="grabber" data-close></div>
    <button type="button" class="sheet-close" data-close aria-label="Kapat">
      <svg viewBox="0 0 24 24"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"/></svg>
    </button>
    <div id="sheet-body"></div>
  </article>
</div>

<script src="app.js"></script>
</body>
</html>
